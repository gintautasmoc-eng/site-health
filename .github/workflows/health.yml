name: Site Health Check

on:
  schedule:
    # Every hour on the hour (UTC). ~24 checks/day/site.
    - cron: '0 * * * *'
  workflow_dispatch: # manual trigger from GitHub UI

permissions:
  contents: write # needed to commit state.json back

concurrency:
  group: site-health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run probe
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: node probe.mjs

      - name: Commit state.json if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git add state.json
            git commit -m "chore: health check $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push || (git pull --rebase && git push)
          else
            echo "state.json unchanged"
          fi
